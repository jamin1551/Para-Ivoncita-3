<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Ivoncita ❤️</title>
    <style>
        body {
            margin: 0;
            background: #050b18; /* Azul noche profundo */
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Times New Roman', serif;
            text-align: center;
        }

        /* La Luna Artística con resplandor */
        .moon {
            position: absolute;
            top: 10%;
            right: 15%;
            width: 90px;
            height: 90px;
            background: #fefce8;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #fff,
                0 0 60px 20px rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        #stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: blink var(--d) infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.1; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 25px;
            font-weight: lighter;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        #love-letter {
            font-size: 1.8rem;
            line-height: 1.6;
            min-height: 120px;
            white-space: pre-wrap;
            color: #e2e8f0;
        }

        .btn-magic {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 12px 40px;
            border-radius: 2px; /* Estilo minimalista */
            cursor: pointer;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.5s;
        }

        .btn-magic:hover {
            background: white;
            color: #050b18;
            box-shadow: 0 0 20px white;
        }
    </style>
</head>
<body>

    <div class="moon"></div>
    <div id="stars"></div>

    <div class="container">
        <h1>IVONCITA</h1>
        <div id="love-letter"></div>
        <br>
        <button class="btn-magic" id="btn">Abrir Universo 🎁</button>
    </div>

    <audio id="musica" src="musica.mp3" preload="auto"></audio>

    <script>
        // Generador de estrellas con tamaños variados
        const sc = document.getElementById('stars');
        for (let i = 0; i < 200; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2.5 + 'px';
            s.style.width = size; s.style.height = size;
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.setProperty('--d', Math.random() * 5 + 3 + 's');
            sc.appendChild(s);
        }

        const audio = document.getElementById('musica');
        const btn = document.getElementById('btn');
        const letter = document.getElementById('love-letter');

        // Solo el mensaje que pediste
        const msg = "Te extraño mi amorcito.\nEres la Luna que acelera mi corazón.";

        btn.onclick = () => {
            btn.style.opacity = '0';
            setTimeout(() => btn.style.display = 'none', 500);
            
            audio.play();
            
            let i = 0;
            function type() {
                if (i < msg.length) {
                    letter.innerHTML += msg.charAt(i);
                    i++;
                    setTimeout(type, 90);
                }
            }
            type();
        };
    </script>
</body>
</html>
