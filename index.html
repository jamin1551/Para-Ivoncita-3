<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Ivoncita ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #020617;
            background: linear-gradient(to bottom, #020617 0%, #0f172a 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Georgia', serif;
            text-align: center;
        }

        /* La Luna de Zoé */
        .moon {
            position: absolute;
            top: 10%;
            right: 15%;
            width: 80px;
            height: 80px;
            background: #f1f5f9;
            border-radius: 50%;
            box-shadow: 0 0 40px 10px rgba(255, 255, 255, 0.3);
            z-index: 1;
        }

        #stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: pulse var(--d) infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 20px;
            max-width: 600px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
        }

        #lyrics {
            font-size: 1.4rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            height: 30px;
            font-style: italic;
        }

        #love-letter {
            font-size: 1.6rem;
            line-height: 1.5;
            color: #f8fafc;
            min-height: 100px;
            white-space: pre-wrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn-regalo {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.4s;
            backdrop-filter: blur(5px);
        }

        .btn-regalo:hover {
            background: white;
            color: #020617;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="moon"></div>
    <div id="stars"></div>

    <div class="container">
        <h1>Para mi Ivoncita ❤️</h1>
        <div id="lyrics"></div>
        <div id="love-letter"></div>
        <br>
        <button class="btn-regalo" id="playBtn">Abrir regalo 🎁</button>
    </div>

    <audio id="audio" src="musica.mp3" preload="auto"></audio>

    <script>
        // Crear estrellas más artísticas
        const starContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--d', Math.random() * 4 + 2 + 's');
            starContainer.appendChild(star);
        }

        const audio = document.getElementById('audio');
        const btn = document.getElementById('playBtn');
        const lyricsDiv = document.getElementById('lyrics');
        const letterDiv = document.getElementById('love-letter');

        const phrase1 = "Y cuando, te me acercas....";
        const finalMessage = "Te extraño mi amorcito.\nEres la Luna que acelera mi corazón.";

        btn.addEventListener('click', () => {
            btn.style.display = 'none';
            
            // Iniciar audio
            audio.play().catch(error => {
                console.log("El navegador bloqueó el audio: ", error);
            });

            // Animación de la letra de la canción
            let j = 0;
            function typeLyrics() {
                if (j < phrase1.length) {
                    lyricsDiv.innerHTML += phrase1.charAt(j);
                    j++;
                    setTimeout(typeLyrics, 100);
                } else {
                    // Después de la letra, aparece la carta
                    setTimeout(typeLetter, 1000);
                }
            }

            // Animación de la carta de amor
            let k = 0;
            function typeLetter() {
                if (k < finalMessage.length) {
                    letterDiv.innerHTML += finalMessage.charAt(k);
                    k++;
                    setTimeout(typeLetter, 120);
                }
            }

            typeLyrics();
        });
    </script>
</body>
</html>
